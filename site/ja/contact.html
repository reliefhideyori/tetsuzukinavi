<main class="wrap"><h1>お問い合わせ・間違いの報告</h1><p class="lead">間違いや古い情報の報告、ご意見を受け付けます。どの言語でも大丈夫です。</p><div class="notice"><p>個人のビザや契約の相談には答えられません。困ったときは、各ページの「相談先」にある公的な窓口に相談してください。</p></div>
