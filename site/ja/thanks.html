<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>送信しました</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Digital Agency Design System (DADS) based: body 16px/1.7, 8px grid, text #1a1a1a, key blue #0017c1,
   focus = black outline + yellow. Mobile first, one column, max 40rem. Calm palette for trust. */
:root {
  --bg: #ffffff; --bg-sub: #f2f2f2; --bg-soft: #f6f8fc; --fg: #1a1a1a; --fg-sub: #4d4d4d; --line: #cccccc; --line-strong: #666666;
  --key: #0017c1; --key-fg: #ffffff; --key-bg: #e8f1fe; --key-dark: #00118f;
  --error: #ec0000; --error-bg: #fdeeee; --ok: #197a4b; --ok-bg: #e6f5ec;
  --c-social: #3460fb; --c-tax: #9a6fd8; --c-costs: #b8b8b8; --c-left: #197a4b;
  --focus: #ffd43d;
  --font: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --s1: 8px; --s2: 16px; --s3: 24px; --s5: 40px; --s8: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --bg-sub: #1f1f1f; --bg-soft: #171b26; --fg: #f0f0f0; --fg-sub: #b3b3b3; --line: #3d3d3d; --line-strong: #8a8a8a;
    --key: #8fb3ff; --key-fg: #0b1230; --key-bg: #1a2240; --key-dark: #0b1a66; --error: #ff7a7a; --error-bg: #3a1c1c;
    --ok: #6fd39f; --ok-bg: #16301f; --c-social: #7d9bff; --c-tax: #b99be6; --c-costs: #5c5c5c; --c-left: #4fbf86; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --bg-sub: #1f1f1f; --bg-soft: #171b26; --fg: #f0f0f0; --fg-sub: #b3b3b3; --line: #3d3d3d; --line-strong: #8a8a8a;
  --key: #8fb3ff; --key-fg: #0b1230; --key-bg: #1a2240; --key-dark: #0b1a66; --error: #ff7a7a; --error-bg: #3a1c1c;
  --ok: #6fd39f; --ok-bg: #16301f; --c-social: #7d9bff; --c-tax: #b99be6; --c-costs: #5c5c5c; --c-left: #4fbf86; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.7; letter-spacing: .02em; }
.wrap { max-width: 40rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
p { margin: 0 0 var(--s2); } p:last-child { margin-bottom: 0; }
a { color: var(--key); text-underline-offset: 3px; }
button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--fg); outline-offset: 2px; box-shadow: 0 0 0 2px var(--focus); }
.small { font-size: 14px; color: var(--fg-sub); }

/* Site header: calm, official-looking */
.site { background: var(--key-dark); color: #fff; }
.site .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 56px; }
.brand { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.brand svg { width: 24px; height: 24px; flex: none; }
.brand small { display: block; font-weight: 400; font-size: 12px; opacity: .85; line-height: 1.4; }
.lang { color: #fff; font-size: 14px; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; padding: 6px 10px; text-decoration: none; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; }
.badges { background: var(--bg-soft); border-bottom: 1px solid var(--line); }
.badges ul { list-style: none; margin: 0 auto; padding: 8px 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--fg-sub); }
.badges li { display: inline-flex; align-items: center; gap: 6px; }
.badges svg { width: 16px; height: 16px; fill: var(--ok); flex: none; }

main { padding-top: var(--s3); padding-bottom: var(--s8); }
.crumb { font-size: 14px; color: var(--fg-sub); margin: 0 0 var(--s2); }
.crumb ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0 4px; }
.crumb li + li::before { content: "＞"; margin-right: 4px; }
h1 { font-size: 24px; line-height: 1.5; margin: 0 0 var(--s1); }
.lead { color: var(--fg-sub); }
.updated { font-size: 14px; color: var(--fg-sub); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: var(--s1) 0; margin: var(--s2) 0 var(--s3); }
.notice { border: 1px solid var(--key); border-left-width: 6px; padding: var(--s2); margin-bottom: var(--s3); }
.notice.warn { border-color: var(--error); background: var(--error-bg); }
.notice h2, .notice h3 { margin-top: 0; font-size: 17px; border: 0; padding: 0; }
.toc { background: var(--bg-sub); padding: var(--s2); margin-bottom: var(--s5); }
.toc h2 { font-size: 16px; margin: 0 0 var(--s1); border: 0; padding: 0; }
.toc ol { margin: 0; padding-left: 1.5em; } .toc li { padding: 2px 0; }
section { margin-bottom: var(--s5); scroll-margin-top: var(--s2); }
h2 { font-size: 20px; line-height: 1.5; margin: 0 0 var(--s2); padding-bottom: var(--s1); border-bottom: 2px solid var(--fg); }
h3 { font-size: 17px; line-height: 1.6; margin: var(--s3) 0 var(--s1); }
ul, ol { margin: 0 0 var(--s2); padding-left: 1.5em; } li { margin-bottom: 4px; }

/* Form (DADS: label above field, 48px fields, 8px radius) */
.calc { border: 1px solid var(--line-strong); border-radius: 8px; padding: var(--s2); }
.field { margin-bottom: var(--s3); }
.field > label, .field > .lbl { display: block; font-weight: 700; margin-bottom: 4px; }
.field .hint { font-size: 14px; color: var(--fg-sub); margin: 0 0 var(--s1); }
select, input[type="number"] { width: 100%; min-height: 48px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); font-variant-numeric: tabular-nums; }
input[type="number"] { text-align: right; }
.unit { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.unit span { font-size: 14px; color: var(--fg-sub); min-width: 3em; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { min-height: 48px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); padding: 8px; }
.seg button[aria-pressed="true"] { border: 2px solid var(--key); background: var(--key-bg); font-weight: 700; color: var(--key); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.grid3 label, .costs label { font-size: 14px; font-weight: 400; display: block; margin-bottom: 4px; }
.costs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px var(--s2); }
fieldset { border: 0; margin: 0 0 var(--s3); padding: 0; }
legend { font-weight: 700; margin-bottom: 4px; padding: 0; }
.minw { font-size: 14px; color: var(--fg-sub); margin-top: 4px; }

/* Result */
.res { margin-top: var(--s3); border-top: 2px solid var(--fg); padding-top: var(--s2); }
.res h3 { margin-top: 0; }
.big { background: var(--ok-bg); border-left: 6px solid var(--ok); padding: var(--s2); margin-bottom: var(--s2); }
.big .k { font-size: 14px; color: var(--fg-sub); }
.big .v { font-size: 32px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.big .v2 { font-size: 16px; font-variant-numeric: tabular-nums; }
.big.neg { background: var(--error-bg); border-color: var(--error); }
.bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; margin: var(--s2) 0 var(--s1); background: var(--bg-sub); gap: 2px; }
.bar i { display: block; height: 100%; }
.legend { list-style: none; padding: 0; margin: 0 0 var(--s2); display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
.legend li { display: inline-flex; align-items: center; gap: 6px; margin: 0; }
.legend b { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
table { width: 100%; border-collapse: collapse; margin-bottom: var(--s2); font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px var(--s1); border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { text-align: right; white-space: nowrap; }
tr.sum th, tr.sum td { font-weight: 700; border-bottom: 1px solid var(--line-strong); }
tr.sub th { font-weight: 400; padding-left: var(--s3); font-size: 14px; } tr.sub td { font-size: 14px; color: var(--fg-sub); }
.alert { display: none; border-left: 6px solid var(--error); background: var(--error-bg); padding: var(--s2); margin-bottom: var(--s2); }
.alert.show { display: block; }

dl.rows { margin: 0 0 var(--s2); border-top: 1px solid var(--line); }
dl.rows div { display: grid; grid-template-columns: 9em 1fr; gap: var(--s1) var(--s2); padding: 12px 0; border-bottom: 1px solid var(--line); }
dl.rows dt { font-weight: 700; } dl.rows dd { margin: 0; }
details { border-bottom: 1px solid var(--line); } details:first-of-type { border-top: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 12px 32px 12px 0; position: relative; font-weight: 700; min-height: 48px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; position: absolute; right: 8px; top: 20px; width: 8px; height: 8px; border-right: 2px solid var(--fg); border-bottom: 2px solid var(--fg); transform: rotate(45deg); }
details[open] summary::after { transform: rotate(-135deg); top: 24px; }
details .ans { padding: 0 0 var(--s2); }
ul.check { list-style: none; padding: 0; }
ul.check li { position: relative; padding: 10px 0 10px 32px; border-bottom: 1px solid var(--line); margin: 0; }
ul.check li::before { content: ""; position: absolute; left: 0; top: 13px; width: 18px; height: 18px; border: 2px solid var(--fg); border-radius: 4px; }
.contact { border: 1px solid var(--line); border-radius: 8px; padding: var(--s2); margin-bottom: var(--s2); }
.contact h3 { margin-top: 0; }
.tel { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.trust { background: var(--bg-sub); padding: var(--s2); font-size: 14px; }
.trust h2 { font-size: 17px; border: 0; padding: 0; }
.trust h3 { font-size: 14px; margin-top: var(--s2); }
.trust ol, .trust ul { margin-bottom: 0; }
.trust a { word-break: break-all; }
.money { background: var(--bg); border: 1px solid var(--ok); border-left-width: 6px; padding: 12px var(--s2); font-size: 14px; margin-bottom: var(--s2); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 var(--s3); border-radius: 8px; font-weight: 700; border: 1px solid var(--key); background: var(--bg); color: var(--key); text-decoration: none; margin-top: var(--s2); }
footer { border-top: 1px solid var(--line); padding: var(--s3) 0 var(--s5); font-size: 14px; color: var(--fg-sub); }
footer ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; }
@media (max-width: 480px) {
  dl.rows div { grid-template-columns: 1fr; gap: 0; }
  .big .v { font-size: 28px; }
}
</style>
